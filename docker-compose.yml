services:
  mongo:
    image: mongo:7
    container_name: buildplay-mongo
    restart: unless-stopped
    ports:
      # Host side is 27417, not the default 27017 -- lots of dev machines
      # already have some other MongoDB (a native install, a different
      # project's container, MongoDB Compass's bundled server, ...) sitting
      # on the default port. If npm run seed connects to THAT one instead of
      # this container, its data has nothing to do with this project ("db
      # already exists with different case" is the telltale sign). Using an
      # uncommon port means this container can never collide with it.
      - "27417:27017"
    volumes:
      # A Docker-managed named volume rather than a host folder bind-mount.
      # A bind mount under ./data/mongo works fine in most places, but if the
      # project sits inside Desktop/Documents/Downloads on macOS, Docker
      # Desktop needs an extra per-folder permission grant to create files
      # there (System Settings > Privacy & Security > Files and Folders) --
      # a named volume lives inside Docker's own storage instead, so it never
      # runs into that regardless of where the project is checked out.
      - buildplay_mongo_data:/data/db
    command: ["--quiet"]

volumes:
  buildplay_mongo_data:
